[project]
name = "gpufluid"
version = "0.0.2"
description = "GPU FLIP/PIC fluid simulator on NVIDIA Warp"
requires-python = ">=3.10"
dependencies = [
    "warp-lang>=1.13",
    "numpy",
    "scikit-image",
    "trimesh",
    "rtree",
]

[project.optional-dependencies]
viz = ["matplotlib", "imageio", "pillow"]
test = ["pytest"]

[project.scripts]
gpufluid = "gpufluid.cli.commands:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -q"
markers = [
    "gpu: requires CUDA",
    "slow: run >2 s",
]
