# Step 11: seed water from arbitrary mesh shape (an oblong blob)

[domain]
resolution = [64, 64, 64]

[fluid]
type = "mesh"
path = "blob.obj"
scale = 1.0
translate = [0.5, 0.7, 0.5]
ppc = 8

[simulation]
dt = 0.005
pressure_iters = 60
pressure_solver = "jacobi"
gravity = -9.81
frames = 90
fps = 24

[output]
cache_dir = "../../out/mesh_seed"
mesh = true
iso_level = 0.55
smooth_passes = 2
mesh_smooth_passes = 4
wall_margin_cells = 2
usd = false
