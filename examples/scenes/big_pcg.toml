# Step 3 demo: 96³ grid, PCG pressure solver, longer waterfall.

[domain]
resolution = [96, 96, 96]

[fluid]
type = "box"
lo = [0.05, 0.05, 0.05]
hi = [0.20, 0.10, 0.20]
ppc = 8

[[inflow]]
lo = [0.20, 0.85, 0.40]
hi = [0.35, 0.95, 0.60]
velocity = [0.0, -3.0, 0.0]
rate_per_sec = 30000

[[outflow]]
lo = [0.90, 0.00, 0.00]
hi = [1.00, 0.10, 1.00]

[[obstacle]]
type = "cylinder_y"
center = [0.55, 0.30, 0.50]
radius = 0.08
half_height = 0.30

[simulation]
dt = 0.005
pressure_iters = 60
pressure_solver = "pcg"
flip_blend = 0.95
gravity = -9.81
frames = 90
fps = 24

[output]
cache_dir = "../../out/big_pcg"
mesh = true
iso_level = 0.6
smooth_passes = 2
mesh_smooth_passes = 4
mesh_smooth_method = "taubin"
wall_margin_cells = 2
usd = true
whitewater = true
whitewater_speed_threshold = 3.5
whitewater_lifetime_sec = 1.2
