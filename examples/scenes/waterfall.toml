# v0.5 demo: waterfall (inflow at top, outflow at bottom-front edge)
# plus an animated ball that drops into the water.

[domain]
resolution = [64, 64, 64]

# Tiny seed of fluid at bottom so the marker has a fluid cell to start the
# pressure solve before the inflow ramps up.
[fluid]
type = "box"
lo = [0.05, 0.05, 0.05]
hi = [0.15, 0.10, 0.15]
ppc = 8

# Continuous waterfall source from the top, pointing down.
[[inflow]]
lo = [0.20, 0.85, 0.40]
hi = [0.35, 0.95, 0.60]
velocity = [0.0, -3.0, 0.0]
rate_per_sec = 20000

# Drain along the far-right edge at floor level.
[[outflow]]
lo = [0.90, 0.00, 0.00]
hi = [1.00, 0.10, 1.00]

# Animated sphere that drops from the top centre into the pool.
[[obstacle]]
type = "sphere"
center = [0.65, 0.85, 0.50]
radius = 0.08
motion = { kind = "linear", velocity = [0.0, -0.8, 0.0] }

[simulation]
dt = 0.005
pressure_iters = 60
pressure_solver = "jacobi"
flip_blend = 0.95
gravity = -9.81
frames = 90
fps = 24

[output]
cache_dir = "../../out/waterfall"
mesh = true
iso_level = 0.6
smooth_passes = 2
mesh_smooth_passes = 4
mesh_smooth_method = "taubin"
wall_margin_cells = 2          # M5.7 — strip mesh near domain walls
usd = true                     # I6.5 — also write cache.usdc
