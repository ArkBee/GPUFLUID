# Step 9 demo: million-particle waterfall. Inflow rate driven up until ~1M
# particles. Outflow at the floor edge drains. GPU stream compaction keeps
# the particle array compact each frame.

[domain]
resolution = [96, 96, 96]

[fluid]
type = "box"
lo = [0.05, 0.05, 0.05]
hi = [0.50, 0.50, 0.50]
ppc = 8

[[inflow]]
lo = [0.10, 0.85, 0.30]
hi = [0.40, 0.95, 0.70]
velocity = [0.0, -4.0, 0.0]
rate_per_sec = 200000

[[outflow]]
lo = [0.85, 0.0, 0.0]
hi = [1.0, 0.1, 1.0]

[simulation]
dt = 0.005
pressure_iters = 60
pressure_solver = "jacobi"
gravity = -9.81
frames = 60
fps = 24

[output]
cache_dir = "../../out/million"
mesh = true
iso_level = 0.6
smooth_passes = 2
mesh_smooth_passes = 4
mesh_smooth_method = "taubin"
wall_margin_cells = 2
usd = false
