# Step 24 — kitchen-sink v0.8 showcase.
# Stacks every major v0.8 feature into one bake:
#   * S2.15  multi-source colour (red box + blue box)
#   * S2.14  surface tension (mild — visible rounding on the falling drops)
#   * S2.12  APIC transfer mode (B6 verified safe with CSF on this scene shape)
#   * D4.2.1 sphere obstacle (the drops hit it and splash)
#   * W7.7   trapped-air potential whitewater emit (B3.3)
#   * I6.5   USD output for the native Blender MeshSequenceCache path
#   * F3.4   CFL substepping (auto-engaged because surface_tension > 0)

[domain]
resolution = [64, 64, 64]

[[fluids]]
type = "box"
lo = [0.15, 0.55, 0.35]
hi = [0.40, 0.80, 0.65]
ppc = 8
color = [1.00, 0.10, 0.10]    # red

[[fluids]]
type = "box"
lo = [0.60, 0.55, 0.35]
hi = [0.85, 0.80, 0.65]
ppc = 8
color = [0.10, 0.30, 1.00]    # blue

# A sphere in the middle of the basin — the two cubes drop on it and splash.
[[obstacle]]
type = "sphere"
center = [0.50, 0.25, 0.50]
radius = 0.12

[simulation]
dt = 0.005
pressure_iters = 50
pressure_solver = "jacobi"
flip_blend = 0.95              # ignored when transfer_mode = apic
transfer_mode = "apic"
gravity = -9.81
surface_tension = 0.1          # light — rounds the masses a touch but keeps
                               # the splash energetic enough for whitewater
csf_smoothing_passes = 2
viscosity = 0.0                # no extra damping; let APIC + light σ shape it
cfl = true                     # auto-on via σ>0 anyway
cfl_max_substeps = 32
frames = 90
fps = 24

[output]
cache_dir = "../../out/step24_kitchen_sink"
mesh = true
iso_level = 0.6
smooth_passes = 2
mesh_smooth_passes = 4
mesh_smooth_method = "taubin"
wall_margin_cells = 2
particles = true               # need particle .npy + colour sidecars for render
whitewater = true
whitewater_speed_threshold = 1.5
whitewater_emit_per_frame_max = 2000
whitewater_total_cap = 30000
whitewater_use_potential = true
whitewater_potential_v_max = 8.0
