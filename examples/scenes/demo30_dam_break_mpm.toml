# demo30 HERO v2 — MPM dam-break around a pillar (the judge panel's pick).
#
# Panel verdict (2026-06-13): of 4 candidates only the FLIP dam_break showed a
# real collapse->spread->pool arc (score 6/10); its only defects were RENDER/
# MESHER, not physics — blobby 64^3 marching-cubes, water clinging to domain
# walls as a membrane. This is that scene on the PRODUCTION solver (MPM, the
# FU-017 default) with the panel's high-priority fixes applied:
#   * resolution 64 -> 96  (kills the fused-metaball / voxel stair-step splash)
#   * iso_level 0.6 -> 0.5  (cleaner surface)
#   * fluid INSET from the domain walls + wall_margin_cells 2 -> 3
#     (kills the "tub-liner" wall membrane both mesher judges flagged)

[domain]
resolution = [96, 96, 96]
size_world = [2.0, 2.0, 2.0]

# Tall column on the left, INSET from every wall (lo>=0.10, hi<=0.82) so the
# collapse doesn't smear a membrane up the domain boundary.
[[fluids]]
type = "box"
lo = [0.10, 0.08, 0.22]
hi = [0.34, 0.78, 0.78]
ppc = 8
color = [0.20, 0.55, 0.90]

# Box pillar the collapsing wave wraps around (kept inside the inset region).
[[obstacle]]
type = "box"
center = [0.58, 0.13, 0.50]
half_size = [0.06, 0.13, 0.06]

[simulation]
solver = "mpm"
dt = 0.0015
pressure_iters = 0
pressure_solver = "pcg"
gravity = -9.81
frames = 60
fps = 24
cfl = true
cfl_factor = 0.6
cfl_max_substeps = 16

[simulation.mpm]
bulk_modulus = 1000.0
cube_friction = 0.3

[output]
cache_dir = "tmp/demo30/dam_break_mpm"
mesh = true
iso_level = 0.5
smooth_passes = 2
mesh_smooth_passes = 3
mesh_smooth_method = "taubin"
decimate_ratio = 1.0
wall_margin_cells = 3
particles = true
usd = false
color_mix_mode = "off"
