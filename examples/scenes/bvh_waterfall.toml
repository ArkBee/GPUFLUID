# Step 19 demo: 20k-tri torus obstacle with water poured over it.
# Pre-BVH this scene would take 23+ ms/frame on D4.3.GPU (brute-force ray-cast
# for every cell × every triangle). With D4.3.GPU.BVH it's ~10 ms — and that
# matters because the obstacle is rebuilt every frame if animated. Even for
# the static case it lets us push tri counts that we previously couldn't.

[domain]
resolution = [64, 64, 64]

[fluid]
type = "box"
lo = [0.20, 0.85, 0.30]
hi = [0.80, 0.95, 0.70]
ppc = 8

[[obstacle]]
type = "mesh"
path = "torus_hires.obj"

[simulation]
dt = 0.005
pressure_iters = 60
pressure_solver = "jacobi"
flip_blend = 0.95
gravity = -9.81
frames = 90
fps = 24

[output]
cache_dir = "../../out/bvh_waterfall"
mesh = true
iso_level = 0.6
smooth_passes = 2
mesh_smooth_passes = 4
mesh_smooth_method = "taubin"
wall_margin_cells = 2
