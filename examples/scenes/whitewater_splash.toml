# Step 22 demo: waterfall splash with foam/spray/bubble differentiation (W7.4/W7.5).
#
# A jet of water plunges into a basin. The impact produces all three classes
# of whitewater:
#   * Spray — droplets thrown up out of the basin (above density surface).
#   * Foam — surface bubbles on top of the water pool.
#   * Bubble — submerged air pockets that rise and pop at the surface.

[domain]
resolution = [80, 80, 80]

[fluid]
type = "box"
lo = [0.10, 0.05, 0.10]
hi = [0.90, 0.30, 0.90]
ppc = 8

[[inflow]]
lo = [0.40, 0.85, 0.40]
hi = [0.60, 0.95, 0.60]
velocity = [0.0, -6.0, 0.0]
rate_per_sec = 50000
frame_start = 0
frame_end = 90

[simulation]
dt = 0.005
pressure_iters = 60
pressure_solver = "jacobi"
flip_blend = 0.95
gravity = -9.81
frames = 90
fps = 24

[output]
cache_dir = "../../out/whitewater_splash"
mesh = true
iso_level = 0.6
smooth_passes = 2
mesh_smooth_passes = 4
mesh_smooth_method = "taubin"
wall_margin_cells = 2
whitewater = true
whitewater_speed_threshold = 3.5
whitewater_emit_per_frame_max = 3000
whitewater_total_cap = 60000
