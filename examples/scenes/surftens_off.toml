# Step 17 ablation A: same scene, NO surface tension. The cube should stay
# essentially in place — both as a sanity baseline and to make the contrast
# with surftens_on.toml visually obvious.

[domain]
resolution = [48, 48, 48]

[fluid]
type = "box"
lo = [0.30, 0.30, 0.30]
hi = [0.70, 0.70, 0.70]
ppc = 8

[simulation]
dt = 0.005
pressure_iters = 50
pressure_solver = "jacobi"
flip_blend = 0.0
gravity = 0.0
surface_tension = 0.0
viscosity = 0.05            # matched to surftens_on so the only difference is σ
viscosity_iters = 8
frames = 60
fps = 24

[output]
cache_dir = "../../out/surftens_off"
mesh = true
iso_level = 0.6
smooth_passes = 2
mesh_smooth_passes = 4
mesh_smooth_method = "taubin"
