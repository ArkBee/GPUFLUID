# Step 7 demo: dam-break with APIC transfer. Less noisy, less clumpy.

[domain]
resolution = [64, 64, 64]

[fluid]
type = "box"
lo = [0.06, 0.06, 0.06]
hi = [0.40, 0.80, 0.40]
ppc = 8

[[obstacle]]
type = "sphere"
center = [0.60, 0.20, 0.60]
radius = 0.12

[simulation]
dt = 0.005
pressure_iters = 60
pressure_solver = "jacobi"
transfer_mode = "apic"
gravity = -9.81
frames = 90
fps = 24

[output]
cache_dir = "../../out/apic_swirl"
mesh = true
iso_level = 0.6
smooth_passes = 2
mesh_smooth_passes = 4
mesh_smooth_method = "taubin"
wall_margin_cells = 2
usd = true
