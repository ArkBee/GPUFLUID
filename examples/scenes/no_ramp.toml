# Control for step 13: same falling blob, no ramp.

[domain]
resolution = [64, 64, 64]

[fluid]
type = "box"
lo = [0.15, 0.70, 0.20]
hi = [0.55, 0.92, 0.80]
ppc = 8

[simulation]
dt = 0.005
pressure_iters = 30
pressure_solver = "gsrb"
gravity = -9.81
frames = 36
fps = 24
reseed = true
reseed_every_n_frames = 5

[output]
cache_dir = "../../out/no_ramp"
mesh = true
iso_level = 0.6
smooth_passes = 2
mesh_smooth_passes = 4
wall_margin_cells = 2
decimate_ratio = 0.5
usd = false
