# Visual-regression bench scene 2/3: inflow jet -> box ledge -> pool -> drain.
# Derived from waterfall.toml (kept at 64^3, trimmed semantics) but the
# obstacle is a BOX ledge (the headless renderer only draws box obstacles)
# so the falling stream visibly deflects before pooling.
#
# Physics exercised: continuous inflow, free-fall stream, ledge deflection,
# pooling, outflow drain (steady-state mass balance).

[domain]
resolution = [64, 64, 64]

# Tiny seed of fluid at the bottom so the pressure solve has fluid cells
# before the inflow ramps up (same trick as waterfall.toml).
[fluid]
type = "box"
lo = [0.05, 0.05, 0.05]
hi = [0.15, 0.10, 0.15]
ppc = 8
# Bright per-vertex color — see bench_dam_break.toml note.
color = [0.35, 0.80, 1.00]

[[inflow]]
lo = [0.20, 0.85, 0.40]
hi = [0.35, 0.95, 0.60]
velocity = [0.0, -2.5, 0.0]
rate_per_sec = 15000
color = [0.35, 0.80, 1.00]
frame_start = 0
frame_end = 80

[[outflow]]
lo = [0.90, 0.00, 0.00]
hi = [1.00, 0.10, 1.00]

# Box ledge under the stream — deflects the jet sideways before it pools.
[[obstacle]]
type = "box"
center = [0.40, 0.45, 0.50]
half_size = [0.18, 0.03, 0.25]

[simulation]
dt = 0.005
pressure_iters = 60
pressure_solver = "jacobi"
flip_blend = 0.95
gravity = -9.81
frames = 80
fps = 24

[output]
cache_dir = "../../tmp/bench/waterfall"
mesh = true
iso_level = 0.6
smooth_passes = 2
mesh_smooth_passes = 4
mesh_smooth_method = "taubin"
wall_margin_cells = 2
particles = true   # scatter fallback for visual_bench --skip-render
