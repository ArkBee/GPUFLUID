# step27 — B7-alt v1.0 macro closure demo. Same 96^3 scene shape as
# big_pcg / step26 (visual continuity with the previous perf-overlay
# demo) but baked with enable_sub_dense + enable_cuda_graphs so the
# sub-dense pressure path actually runs.

[domain]
resolution = [96, 96, 96]

[fluid]
type = "box"
lo = [0.05, 0.05, 0.05]
hi = [0.20, 0.10, 0.20]
ppc = 8

[[inflow]]
lo = [0.20, 0.85, 0.40]
hi = [0.35, 0.95, 0.60]
velocity = [0.0, -3.0, 0.0]
rate_per_sec = 30000

[[outflow]]
lo = [0.90, 0.00, 0.00]
hi = [1.00, 0.10, 1.00]

[[obstacle]]
type = "cylinder_y"
center = [0.55, 0.30, 0.50]
radius = 0.08
half_height = 0.30

[simulation]
dt = 0.005
pressure_iters = 60
pressure_solver = "pcg"
flip_blend = 0.95
gravity = -9.81
frames = 90
fps = 24

[output]
cache_dir = "../../out/step27_sub_dense"
mesh = true
iso_level = 0.6
