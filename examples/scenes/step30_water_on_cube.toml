# step30 — water pouring on cube obstacle (10 sec @ 60fps demo).
#
# First of the three "fluid families" demos. Tuning rationale:
#   * viscosity = 0  -> no extra damping; splash is unconstrained
#   * surface_tension = 0  -> droplets fragment freely, no beading
#   * pressure_solver = "pcg"  -> cleanest for high-energy splash
#   * transfer_mode = "flip"  -> bouncy, splash-friendly
#   * flip_blend = 0.95  -> default; preserves splashy energy
#
# Shared with step31_oil / step32_honey: 96^3 domain, 0.3 cube obstacle
# at (0.5, 0.4, 0.5), inflow jet from top centred.

[domain]
resolution = [96, 96, 96]

# No initial fluid pool — only the inflow jet streams from above.
# Degenerate box (zero volume) is the canonical "empty" form.
[fluid]
type = "box"
lo = [0.0, 0.0, 0.0]
hi = [0.0, 0.0, 0.0]
ppc = 0

[[obstacle]]
type = "box"
center = [0.5, 0.4, 0.5]
half_size = [0.15, 0.15, 0.15]

[[inflow]]
lo = [0.43, 0.85, 0.43]
hi = [0.57, 0.95, 0.57]
velocity = [0.0, -3.0, 0.0]
rate_per_sec = 40000
frame_start = 0
frame_end = 600

[simulation]
dt = 0.005
pressure_iters = 60
pressure_solver = "pcg"
flip_blend = 0.95
gravity = -9.81
viscosity = 0.0
surface_tension = 0.0
frames = 600
fps = 60

[output]
cache_dir = "../../out/step30_water_on_cube"
mesh = true
iso_level = 0.3
smooth_passes = 2
mesh_smooth_passes = 4
mesh_smooth_method = "taubin"
wall_margin_cells = 2
