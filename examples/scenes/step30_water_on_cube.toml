# step30 — water pouring on cube obstacle (10 sec @ 60fps demo).
#
# First of the three "fluid families" demos. Tuning rationale:
#   * viscosity = 0  -> no extra damping; splash is unconstrained
#   * surface_tension = 0  -> droplets fragment freely, no beading
#   * pressure_solver = "pcg"  -> cleanest for high-energy splash
#   * transfer_mode = "flip"  -> bouncy, splash-friendly
#   * flip_blend = 0.95  -> default; preserves splashy energy
#
# Shared with step31_oil / step32_honey: 96^3 domain, 0.3 cube obstacle
# at (0.5, 0.4, 0.5), inflow jet from top centred.

[domain]
resolution = [192, 192, 192]

# No initial fluid pool — only the inflow jet streams from above.
# Degenerate box (zero volume) is the canonical "empty" form.
[fluid]
type = "box"
lo = [0.0, 0.0, 0.0]
hi = [0.0, 0.0, 0.0]
ppc = 0

[[obstacle]]
type = "box"
center = [0.5, 0.4, 0.5]
# B16.2 stream-visibility test: cube essentially removed so water falls
# straight to floor as a clean stream — no splash interference.
half_size = [0.001, 0.001, 0.001]

[[inflow]]
# Faucet-nozzle iteration 2026-05-17: shrink emitter box to ~2cm cube
# centred above cube top. Wide-box emitters scatter particles randomly
# inside the box volume and look like spray; a ~2vx box is the smallest
# coherent stream that the iso mesher still resolves at 96^3.
lo = [0.49, 0.93, 0.49]
hi = [0.51, 0.95, 0.51]
velocity = [0.0, -1.0, 0.0]
# B16.2 push for visible mid-air column with SDF: rate=30000 (4x baseline).
# SDF doesn't sum kernels like density-MC did, so should not gel-cube.
rate_per_sec = 30000
frame_start = 0
frame_end = 600

[simulation]
dt = 0.005
pressure_iters = 60
pressure_solver = "pcg"
# Reduced from 0.95 -> less particle noise, more sheet behaviour.
flip_blend = 0.85
gravity = -9.81
# Tiny viscosity so flow coheres without becoming oil.
viscosity = 0.003
surface_tension = 0.0
frames = 600
fps = 60

[output]
cache_dir = "../../out/step30_water_on_cube"
mesh = true
particles = true  # B13.8 Yu-Turk eval — dump per-frame particle positions
# B14 M5.9: cubic kernel R=2 + iso=0.8 baseline ("E config") — best
# surface look on cube + pool. Mid-air column remains the open problem,
# tracked as B15/M5.10 Akinci adaptive sampling.
mesh_method = "cubic"
cubic_radius_cells = 2.0
# Cubic kernel R=2 sweet spot for step30: 0.2 too thick (couch fabric),
# 2.0 too thin (cube looks dry). 0.8 = smooth pool + thin film on cube
# face. Migration note in DESIGN.md §8.3.
iso_level = 0.8
# B + C combo 2026-05-18: lower smoothing so mid-air column stays visible
# as a distinct line instead of being averaged into the cube/pool mass.
smooth_passes = 2
mesh_smooth_passes = 4
mesh_smooth_method = "taubin"
wall_margin_cells = 2
