# Step 6 demo: viscous "honey" pile collapsing slowly.

[domain]
resolution = [64, 64, 64]

[fluid]
type = "box"
lo = [0.40, 0.40, 0.40]
hi = [0.60, 0.85, 0.60]
ppc = 8

[simulation]
dt = 0.005
pressure_iters = 60
pressure_solver = "jacobi"
flip_blend = 0.95
gravity = -9.81
viscosity = 1.5            # high — molasses-like
viscosity_iters = 14
frames = 90
fps = 24

[output]
cache_dir = "../../out/honey"
mesh = true
iso_level = 0.6
smooth_passes = 2
mesh_smooth_passes = 6
mesh_smooth_method = "taubin"
wall_margin_cells = 2
usd = true
